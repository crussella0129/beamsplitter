services:
  postgres:
    image: postgres:16-alpine
    container_name: beamsplitter-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: beamsplitter
      POSTGRES_PASSWORD: beamsplitter
      POSTGRES_DB: beamsplitter
    volumes:
      - beamsplitter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beamsplitter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  beamsplitter-pgdata:
